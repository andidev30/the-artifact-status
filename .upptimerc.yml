owner: andidev30
repo: the-artifact-status

# Every 5 minutes (Upptime's default). A down site opens an issue here, assigned to the owner.
assignees:
  - andidev30

sites:
  # The app, Postgres and the bucket together
  - name: Hosted service
    url: https://the-artifact-pi.vercel.app/readyz
    expectedStatusCodes:
      - 200
  # The API function alone, to tell a code or platform outage from a database one
  - name: API
    url: https://the-artifact-pi.vercel.app/healthz
    expectedStatusCodes:
      - 200
  # The static web app
  - name: Website
    url: https://the-artifact-pi.vercel.app/
    expectedStatusCodes:
      - 200

status-website:
  baseUrl: /the-artifact-status
  name: The Artifact status
  introTitle: "**The Artifact** hosted service status"
  introMessage: Checked every 5 minutes from GitHub Actions. Self-hosted installs aren't monitored here.
  navbar:
    - title: Status
      href: /
    - title: The Artifact
      href: https://the-artifact-pi.vercel.app/
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
